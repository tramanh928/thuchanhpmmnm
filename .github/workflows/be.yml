name: Backend CI

on:
  push:
    paths:
      - "backend/**"

jobs:
  start:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm install
        working-directory: ./backend
      - run: node index.js
        working-directory: ./backend