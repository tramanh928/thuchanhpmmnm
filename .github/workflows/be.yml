name: Backend CI

on:
  push:
    branches: [ "main" ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          cd backend
          npm install

      - name: Check backend entry file
        run: |
          cd backend
          node -c index.js

      - name: CI success
        run: echo "Backend CI passed"